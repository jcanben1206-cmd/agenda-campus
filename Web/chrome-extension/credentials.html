<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta EducaAnd · Agenda Campus</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  main { max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
  form, label { display: grid; gap: .5rem; }
  form { gap: 1rem; }
  input, button { font: inherit; padding: .5rem; }
  label, button { font-weight: 600; }
</style>
<main>
  <h1>Cuenta de Moodle Sevilla</h1>
  <p>Guarda las credenciales de EducaAnd para que la extensión pueda volver a iniciar sesión desde este perfil de Chrome.</p>
  <form id="credentials">
    <label>Usuario de EducaAnd <input id="username" autocomplete="username" maxlength="254" required></label>
    <label>Contraseña <input id="password" type="password" autocomplete="off" maxlength="512" required></label>
    <div><button type="submit">Guardar y sincronizar</button> <button type="button" id="remove" hidden>Borrar credenciales</button></div>
  </form>
  <p id="status" role="status"></p>
  <section aria-labelledby="pages-title">
    <h2 id="pages-title">GitHub Pages</h2>
    <form id="pages">
      <label>Dirección publicada <input id="pages-url" type="url" placeholder="https://usuario.github.io/agenda-campus/" required></label>
      <div><button type="submit">Vincular web</button> <button type="button" id="remove-pages" hidden>Desvincular web</button></div>
    </form>
    <p id="pages-status" role="status"></p>
  </section>
</main>
<script src="agenda-origin.js"></script>
<script src="credentials.js"></script>
<script src="pages.js"></script>
</html>
