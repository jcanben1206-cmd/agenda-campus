name: Publish Agenda Campus

on:
  push:
    paths:
      - 'Web/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          path: Web/dist
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --silent 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact is not available yet."
          exit 1
      - name: Deploy the uploaded artifact to Pages
        uses: actions/github-script@v7
        id: deployment
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const repository = context.repo;
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repository,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            });
            core.setOutput('page_url', data.page_url);
            const deploymentId = data.id || data.status_url?.split('/').pop();
            for (let attempt = 0; attempt < 36; attempt++) {
              const { data: result } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',
                { ...repository, deploymentId }
              );
              if (result.status === 'succeed') return;
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(result.status)) {
                throw new Error('GitHub Pages reported ' + result.status);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('GitHub Pages did not report a final deployment status.');
