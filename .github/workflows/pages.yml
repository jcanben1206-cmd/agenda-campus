name: Publish Agenda Campus

on:
  push:
    paths:
      - 'Web/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          path: Web/dist
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --silent 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact is not available yet."
          exit 1
      - name: Deploy the uploaded artifact to Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          retries: 3
          script: |
            const repository = context.repo;
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Pages upload did not return a valid artifact ID.');
            }
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repository,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            });
            const deploymentId = deployment?.id || deployment?.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('GitHub Pages did not return a deployment ID.');
            const failed = new Set([
              'deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'
            ]);
            for (let attempt = 0; attempt < 36; attempt++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...repository,
                deployment_id: deploymentId
              });
              if (data?.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (failed.has(data?.status)) throw new Error('GitHub Pages reported ' + data.status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('GitHub Pages did not report a final deployment status.');
