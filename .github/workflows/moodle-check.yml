name: Check Moodle in the background

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  id-token: write

concurrency:
  group: moodle-background
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restore encrypted state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/moodle-check.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$prior" ]; then
            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prior/artifacts" --jq '[.artifacts[] | select(.name == "moodle-encrypted-state" and .expired == false)] | length')
            if [ "$available" -gt 0 ]; then
              gh run download "$prior" --repo "$GITHUB_REPOSITORY" --name moodle-encrypted-state --dir moodle-state
            else
              echo "::warning::The previous encrypted state is no longer available."
            fi
          fi
      - name: Check Moodle
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'moodle-state/snapshot';
            const state = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : null;
            const token = await core.getIDToken('agenda-campus-moodle-background');
            const response = await fetch('https://agenda-campus-moodle.onrender.com/api/background/sync', {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: JSON.stringify({ state }),
              redirect: 'error',
              signal: AbortSignal.timeout(170000)
            });
            if (!response.ok) throw new Error('Moodle check failed (HTTP ' + response.status + ').');
            const result = await response.json();
            if (typeof result.state !== 'string') throw new Error('The server did not return encrypted state.');
            fs.mkdirSync('moodle-state', { recursive: true });
            fs.writeFileSync(path, result.state);
            core.info('Moodle changes detected: ' + result.changed);
      - uses: actions/upload-artifact@v4
        with:
          name: moodle-encrypted-state
          path: moodle-state/snapshot
          retention-days: 7
